version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - NEUROSCOPE_RETENTION_HOURS=23
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEUROSCOPE_LANDING_ORIGIN=off
    depends_on:
      - backend
    restart: unless-stopped
